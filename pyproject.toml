[project]
name = "steel-offer-matcher"
version = "0.1.0"
description = "Agentic steel sourcing: RFQ and stock-list extraction, grade resolution and explainable offer matching."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "pydantic-ai-slim[openai]>=2.0",
  "litellm>=1.80",
  "langfuse>=4.0",
  "mcp>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::UserWarning"]
