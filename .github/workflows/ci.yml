name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: tests
        run: make test
      - name: the evaluation gate holds
        run: make gate
      - name: the held-out run refuses a second run
        run: |
          if [ -f reports/heldout.json ]; then
            if make heldout; then echo "held-out ran twice" && exit 1; fi
          fi

  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: steel, POSTGRES_PASSWORD: steel, POSTGRES_DB: steeltest}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steel" --health-interval 2s --health-retries 20
    env:
      STEEL_TEST_DATABASE_URL: postgresql+asyncpg://steel:steel@127.0.0.1:5432/steeltest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: migrations, search contract, Pub/Sub intake, review loop, MCP
        run: make test-service

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd console && npm ci && npm test && npm run build

  image:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t steel-offer-matcher .
